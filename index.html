<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for Lera 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;1,600&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --hot-pink: #ff0054; --soft-pink: #ff85a2; }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        
        body {
            background: #000; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        /* Background Soft Gradient */
        .bg-animate {
            position: fixed; inset: 0;
            background: linear-gradient(45deg, #fce4ec, #ffd1dc, #ff85a2, #fce4ec);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; z-index: -1;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .overlay {
            position: fixed; inset: 0; background: rgba(255, 133, 162, 0.95);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 1000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: 1s ease;
        }

        /* Card Transparan Premium */
        .card {
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px; padding: 40px 25px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(30px);
            transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card.active { opacity: 1; transform: translateY(0); }

        h1 { font-family: 'Dancing Script'; font-size: 3.5rem; color: white; text-shadow: 2px 4px 10px rgba(255, 0, 84, 0.2); }

        /* KUE AESTHETIC (Menggunakan Emote & Glow Efek) */
        .cake-box {
            position: relative; font-size: 80px; margin: 20px 0;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.8));
            animation: floatingCake 3s ease-in-out infinite;
        }
        @keyframes floatingCake {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .candle-light {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 15px; height: 15px; background: orange; border-radius: 50%;
            filter: blur(8px); animation: flicker 0.1s infinite alternate;
        }
        @keyframes flicker { from { opacity: 0.6; } to { opacity: 1; } }

        .quote-box {
            font-size: 1rem; color: #444; line-height: 1.7; font-family: 'Playfair Display';
            font-style: italic; padding: 20px; background: rgba(255, 255, 255, 0.2);
            border-radius: 20px; margin: 20px 0;
        }

        .btn-start {
            background: white; color: var(--hot-pink); border: none;
            padding: 18px 40px; border-radius: 50px; font-weight: bold;
            font-size: 1.2rem; cursor: pointer; box-shadow: 0 10px 30px rgba(255,0,84,0.3);
        }

        /* Particles 3D */
        .floating { position: fixed; pointer-events: none; z-index: 5; animation: floatUp 5s linear forwards; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    
    <div class="overlay" id="loader">
        <h2 style="color:white; font-family:'Dancing Script'; font-size:3rem; margin-bottom:30px;">For Lera...</h2>
        <button class="btn-start" onclick="init()">TAP TO OPEN 🎁</button>
    </div>

    <div class="card" id="mainCard">
        <p style="letter-spacing:5px; color:white; font-size:0.8rem; font-weight:600;">HAPPY BIRTHDAY</p>
        <h1>Lera! 🌸</h1>
        
        <div class="cake-box">
            <div class="candle-light"></div>
            🎂
        </div>

        <div class="quote-box">
             "May every dream you've ever held close to your heart find its way to you. 
            I hope you find a kind of happiness so profound that it lights up even 
            your darkest days. You deserve nothing less than extraordinary."
        </div>
        <p style="color:white; font-style:italic; font-size:0.9rem;">I just want you to know who I am 🧸 🎈</p>
    </div>

    <audio id="mySong" loop>
        <source src="Goo Goo Dolls – Iris [Official Music Video] [4K Remaster] [NdYWuo9OFAw].mp3" type="audio/mpeg">
    </audio>

    <script>
        function init() {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainCard').classList.add('active');
            }, 1000);
            
            const song = document.getElementById('mySong');
            song.play();

            // Loop Emote yang jauh lebih HD & Halus
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'floating';
                const items = ['🌸', '💖', '✨', '🧸', '🎈', '🎀', '🧁'];
                el.innerHTML = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '105vh';
                el.style.fontSize = (Math.random() * 20 + 25) + 'px';
                el.style.animationDuration = (Math.random() * 2 + 4) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 5000);
            }, 250);
        }
    </script>
</body>
</html>
