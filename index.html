<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Gift for Lera 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;1,600&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --hot-pink: #ff0054; --soft-pink: #ff85a2; --glass: rgba(255, 255, 255, 0.2); --glass-border: rgba(255, 255, 255, 0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
            /* PENTING: Untuk memberikan efek perspektif 3D */
            perspective: 2000px;
        }
        .bg-animate {
            position: fixed; inset: 0;
            background: linear-gradient(45deg, #fce4ec, #ffd1dc, #ff85a2, #fce4ec);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; z-index: -1;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .overlay {
            position: fixed; inset: 0; background: rgba(255, 133, 162, 0.9);
            backdrop-filter: blur(15px); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Glass Card HD dengan Efek 3D Tilt */
        .card {
            background: var(--glass); backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--glass-border); border-radius: 40px;
            padding: 50px 30px; width: 95%; max-width: 480px; text-align: center;
            box-shadow: 0 50px 80px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.2);
            opacity: 0; transform: translateY(20px) rotateX(10deg); transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* PENTING: Untuk mengaktifkan dimensi 3D di dalam card */
            transform-style: preserve-3d;
        }
        .card.active { opacity: 1; transform: translateY(0) rotateX(0); }

        h1 {
            font-family: 'Dancing Script', cursive; font-size: 4rem; color: white;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
            /* Membuat tulisan terlihat melayang */
            transform: translateZ(50px);
        }
        .tagline { letter-spacing: 5px; color: white; font-weight: 600; font-size: 0.8rem; transform: translateZ(30px); }

        .quote-box {
            font-family: 'Playfair Display', serif; font-style: italic; color: #444; line-height: 1.8;
            font-size: 1.15rem; margin: 30px 0; padding: 20px;
            background: rgba(255, 255, 255, 0.15); border-radius: 20px;
            transform: translateZ(40px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .btn-start {
            background: white; color: var(--hot-pink); border: none; padding: 18px 45px;
            border-radius: 100px; font-size: 1.3rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 15px 35px rgba(255, 0, 84, 0.4);
            transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.1) rotate(-2deg); }

        /* --- KUE TART 3D --- */
        .cake-wrapper {
            position: relative;
            width: 150px; height: 150px;
            margin: 20px auto 30px;
            transform-style: preserve-3d;
            animation: spinCake 10s linear infinite;
            transform: rotateX(-15deg) rotateY(0deg);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            z-index: 10;
        }
        @keyframes spinCake { 0% { transform: rotateX(-15deg) rotateY(0deg); } 100% { transform: rotateX(-15deg) rotateY(360deg); } }

        .cake { position: absolute; transform-style: preserve-3d; }
        .layer-1 { width: 100px; height: 60px; left: 25px; bottom: 0; }
        .layer-2 { width: 70px; height: 50px; left: 40px; bottom: 60px; }
        
        /* CSS 3D Box Construction */
        .box { position: absolute; transform-style: preserve-3d; }
        .face {
            position: absolute;
            background: rgba(255, 180, 200, 0.8);
            border: 2px solid #fff;
            backdrop-filter: blur(5px);
            opacity: 0.95;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
        }
        
        /* Layer 1 - Bottom (3D Box) */
        .box-1 { width: 100%; height: 100%; top: 0; left: 0; }
        .box-1 .face.front { width: 100px; height: 60px; transform: translateZ(50px); }
        .box-1 .face.back { width: 100px; height: 60px; transform: translateZ(-50px) rotateY(180deg); }
        .box-1 .face.left { width: 100px; height: 60px; transform: translateX(-50px) rotateY(-90deg); }
        .box-1 .face.right { width: 100px; height: 60px; transform: translateX(50px) rotateY(90deg); }
        .box-1 .face.top { width: 100px; height: 100px; transform: translateY(-50px) rotateX(90deg); }
        
        /* Layer 2 - Top (3D Box) */
        .box-2 { width: 100%; height: 100%; top: 0; left: 0; }
        .box-2 .face.front { width: 70px; height: 50px; transform: translateZ(35px); background:rgba(255,160,180,0.8); }
        .box-2 .face.back { width: 70px; height: 50px; transform: translateZ(-35px) rotateY(180deg); background:rgba(255,160,180,0.8); }
        .box-2 .face.left { width: 70px; height: 50px; transform: translateX(-35px) rotateY(-90deg); background:rgba(255,160,180,0.8); }
        .box-2 .face.right { width: 70px; height: 50px; transform: translateX(35px) rotateY(90deg); background:rgba(255,160,180,0.8); }
        .box-2 .face.top { width: 70px; height: 70px; transform: translateY(-35px) rotateX(90deg); background:rgba(255,160,180,0.8); }

        /* Lilin 3D */
        .candle {
            position: absolute; width: 10px; height: 40px;
            background: #ff0; border-radius: 5px;
            left: 30px; bottom: 50px;
            transform: translateZ(30px);
            transform-style: preserve-3d;
            box-shadow: 0 0 10px rgba(255,255,0,0.5);
        }
        .flame {
            position: absolute; width: 10px; height: 15px;
            background: #ff5e00; border-radius: 50% 50% 20% 20%;
            top: -18px; left: 0px;
            animation: flicker 0.1s infinite alternate;
            box-shadow: 0 0 20px #ff5e00, 0 0 40px yellow;
        }
        @keyframes flicker { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.1) rotate(5deg); opacity: 1; } }

        /* --- EMOTE MELAYANG 3D --- */
        .floating { position: fixed; pointer-events: none; z-index: 5; transform-style: preserve-3d; animation: floatUp3D 5s linear forwards; }
        @keyframes floatUp3D {
            0% { transform: translateY(0) scale(0) rotateX(0deg); opacity: 0; }
            15% { opacity: 1; transform: translateY(-20vh) scale(1.2); }
            100% { transform: translateY(-120vh) scale(1.5) rotateX(360deg) rotateY(180deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    <div class="overlay" id="loader">
        <h2 style="color:white; font-family:'Dancing Script'; font-size:3.5rem; margin-bottom:20px;">Lera's Gift...</h2>
        <button class="btn-start" onclick="init()">TAP TO OPEN 🎁</button>
    </div>
    <div class="card" id="mainCard">
        <p class="tagline">FOR YOU</p>
        <h1>Lera! 🌸</h1>
        
        <div class="cake-wrapper">
            <div class="cake layer-1 box">
                <div class="box-1">
                    <div class="face front"></div><div class="face back"></div>
                    <div class="face left"></div><div class="face right"></div>
                    <div class="face top"></div>
                </div>
            </div>
            <div class="cake layer-2 box">
                <div class="box-2">
                    <div class="face front"></div><div class="face back"></div>
                    <div class="face left"></div><div class="face right"></div>
                    <div class="face top"></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>
            </div>
        </div>

        <div class="quote-box">
            "May every dream you've ever held close to your heart find its way to you. 
            I hope you find a kind of happiness so profound that it lights up even 
            your darkest days. You deserve nothing less than extraordinary."
        </div>
        <p style="color:white; font-style:italic; font-size:0.9rem;">I just want you to know who I am 🧸 🎈</p>
    </div>

    <audio id="mySong" loop>
        <source src="Goo Goo Dolls – Iris [Official Music Video] [4K Remaster] [NdYWuo9OFAw].mp3" type="audio/mpeg">
    </audio>

    <script>
        function init() {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('loader').style.display = 'none';
                document.getElementById('mainCard').classList.add('active');
            }, 1000);
            document.getElementById('mySong').play();
            setInterval(createFloatingElement, 200);
        }
        
        function createFloatingElement() {
            const el = document.createElement('div');
            el.className = 'floating';
            // Gabungkan boneka 🧸 dan balon 🎈
            const items = ['🌸', '💖', '✨', '🧸', '🎈', '🎈', '🧸', '🎀'];
            el.innerHTML = items[Math.floor(Math.random() * items.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '105vh';
            el.style.fontSize = (Math.random() * 20 + 25) + 'px';
            el.style.animationDuration = (Math.random() * 2 + 4) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }
        
        // Efek Tilt 3D pada Card (Interaktif Mouse/Jari)
        document.addEventListener('mousemove', (e) => {
            const card = document.getElementById('mainCard');
            if(!card.classList.contains('active')) return;
            let xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
